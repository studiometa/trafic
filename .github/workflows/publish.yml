name: Release

# Each merge into main releases what its fragments describe. A manual run
# (`gh workflow run publish.yml -f version=major`) forces a bump.
# npm trusted publishing (OIDC, no npm token) is bound to this file name: keep
# the publish job here.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version: `auto` follows the fragments; `patch`, `minor` or `major` forces that bump"
        type: choice
        options: [auto, patch, minor, major]
        default: auto

# One release at a time. GitHub keeps only the newest pending run: it
# releases everything that main has at that point.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:ci

  # Folds the fragments, bumps the root and both packages (and
  # package-lock.json), commits `Release <version>`, tags, pushes and creates
  # the GitHub release. `.changelog/prerelease` makes prereleases.
  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      dist-tag: ${{ steps.release.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Release
        id: release
        uses: weareikko/changelog@0b4e3b5d6e33dc7f1379f2e822afbc7d5669c9b5 # 0.1.1
        with:
          command: release
          version: ${{ inputs.version || 'auto' }}

  # "Re-run failed jobs" on this job publishes what a failed run left: each
  # publish step skips a version that npm already has.
  publish:
    name: Publish to npm
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release.outputs.version }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      # The publish steps run `npm publish --ignore-scripts`: build `dist/`
      # first. The test job ran the checks.
      - name: Install and build
        run: |
          npm ci
          npm run build

      # The packages do not depend on each other. A prerelease goes to `next`.
      - name: Publish @studiometa/trafic-cli
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          package: packages/trafic-cli
          access: public
          provenance: true
          tag: ${{ needs.release.outputs.dist-tag }}
      - name: Publish @studiometa/trafic-agent
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          package: packages/trafic-agent
          access: public
          provenance: true
          tag: ${{ needs.release.outputs.dist-tag }}
