name: Release

# Release and npm publish stay in this file: npm trusted publishing (OIDC, no
# npm token) is bound to the workflow file name.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (pre* and prerelease publish on the `next` npm tag)"
        type: choice
        options: [patch, minor, major, prepatch, preminor, premajor, prerelease]
        default: patch
      preid:
        description: "Prerelease identifier, used by pre* and prerelease bumps"
        type: choice
        options: [alpha, beta, rc]
        default: alpha

concurrency: release

permissions: {}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:ci

  release:
    name: Bump version and changelog
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      dist-tag: ${{ steps.version.outputs.dist-tag }}
      # A promoted prerelease can have no fragment, so no changelog section.
      body: ${{ steps.changelog.outputs.changed == 'true' && steps.changelog.outputs.body || format('Stable release of {0}.', steps.version.outputs.previous) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The changelog action reads the commit that added each fragment.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci

      # Bumps the root and all packages, and their versions in package-lock.json.
      # A version with a prerelease part (1.2.0-beta.0) goes to the `next` npm
      # dist-tag, any other version to `latest`.
      - name: Bump version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          PREID: ${{ inputs.preid }}
        run: |
          PREVIOUS=$(node -p 'require("./package.json").version')
          npm version "$BUMP" --preid "$PREID" --workspaces --include-workspace-root --no-git-tag-version
          VERSION=$(node -p 'require("./package.json").version')
          if [[ $VERSION == *-* ]]; then
            PRERELEASE=true
            DIST_TAG=next
          else
            PRERELEASE=false
            DIST_TAG=latest
          fi
          if [[ $PREVIOUS == *-* && $PRERELEASE == false ]]; then
            PROMOTION=true
          else
            PROMOTION=false
          fi
          {
            echo "previous=$PREVIOUS"
            echo "version=$VERSION"
            echo "prerelease=$PRERELEASE"
            echo "dist-tag=$DIST_TAG"
            echo "promotion=$PROMOTION"
          } >> "$GITHUB_OUTPUT"

      - name: Fold changelog fragments
        id: changelog
        uses: weareikko/changelog@c25888e03ad7c8bbaee897b84e778ebce9e9301c # 1.0.3
        with:
          command: release
          version: ${{ steps.version.outputs.version }}

      # Promoting a prerelease (1.0.0-rc.1 to 1.0.0) can have no fragment: its
      # changes are in the prerelease section of the changelog.
      - name: Fail when there is nothing to release
        if: steps.changelog.outputs.changed != 'true' && steps.version.outputs.promotion != 'true'
        run: |
          echo "::error::No fragment in .changelog/: nothing to release."
          exit 1

      - name: Commit, tag and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md .changelog package.json package-lock.json packages/*/package.json
          git commit -m "Release $VERSION"
          git tag "$VERSION"
          git push --atomic origin HEAD:main "$VERSION"

  # A tag pushed with GITHUB_TOKEN does not start other workflows, so the
  # publish job runs in the same run, on the release tag.
  # Each publish step skips a version that npm already has, so "Re-run failed
  # jobs" publishes the packages that a failed run did not publish.
  publish:
    name: Publish to npm
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.version }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      # The publish steps run `npm publish --ignore-scripts`: build first.
      - run: npm run build
      - name: Publish @studiometa/trafic-cli
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          package: packages/trafic-cli
          access: public
          provenance: true
          tag: ${{ needs.release.outputs.dist-tag }}
      - name: Publish @studiometa/trafic-agent
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          package: packages/trafic-agent
          access: public
          provenance: true
          tag: ${{ needs.release.outputs.dist-tag }}
      - uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ needs.release.outputs.version }}
          name: ${{ needs.release.outputs.version }}
          body: ${{ needs.release.outputs.body }}
          prerelease: ${{ needs.release.outputs.prerelease }}
          # GitHub's latest release follows the `latest` npm dist-tag.
          makeLatest: ${{ needs.release.outputs.prerelease != 'true' }}
          # A replay updates the release when a previous run created it.
          allowUpdates: true
