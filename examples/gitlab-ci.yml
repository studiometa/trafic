# GitLab CI — Deploy to DDEV server with trafic
#
# Required CI/CD variables:
#   SSH_PRIVATE_KEY (file) — SSH key with access to the server
#   SSH_HOST — Server hostname or IP
#
# The jobs pass the key to ssh with --ssh-options and do not start an
# ssh-agent: in GitLab CI, an ssh-agent left running keeps the job
# running for up to an hour. See the CLI README.

stages:
  - install
  - build
  - deploy

install:
  stage: install
  image: node:24
  script:
    - npm ci
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/

build:
  stage: build
  image: node:24
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

# Deploy to preprod (develop branch)
deploy_preprod:
  stage: deploy
  image: node:24
  before_script:
    - chmod 600 "$SSH_PRIVATE_KEY"
  script:
    - >-
      npx @studiometa/trafic-cli deploy
      --host $SSH_HOST
      --name $CI_PROJECT_PATH_SLUG
      --ssh-options="-i $SSH_PRIVATE_KEY -o IdentitiesOnly=yes"
      --sync "dist/"
      --script "composer install --no-dev"
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

# Deploy preview environment (merge requests)
deploy_preview:
  stage: deploy
  image: node:24
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    on_stop: destroy_preview
  before_script:
    - chmod 600 "$SSH_PRIVATE_KEY"
  script:
    - >-
      npx @studiometa/trafic-cli deploy
      --host $SSH_HOST
      --name $CI_PROJECT_PATH_SLUG
      --preview $CI_MERGE_REQUEST_IID
      --ssh-options="-i $SSH_PRIVATE_KEY -o IdentitiesOnly=yes"
      --sync "dist/"
      --script "composer install --no-dev"
  rules:
    - if: $CI_MERGE_REQUEST_ID

# Destroy preview environment
destroy_preview:
  stage: deploy
  image: node:24
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    action: stop
  before_script:
    - chmod 600 "$SSH_PRIVATE_KEY"
  # Add --backup to keep the database and uploads, or --delay 48h to keep
  # the preview for 2 days
  script:
    - >-
      npx @studiometa/trafic-cli destroy
      --host $SSH_HOST
      --name $CI_PROJECT_PATH_SLUG
      --preview $CI_MERGE_REQUEST_IID
      --ssh-options="-i $SSH_PRIVATE_KEY -o IdentitiesOnly=yes"
  allow_failure: true
  rules:
    - if: $CI_MERGE_REQUEST_ID
      when: manual
